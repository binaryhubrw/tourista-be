# Server stack: single-node MongoDB replica set + the API image published by CI.
#
#   cp .env.production.example .env   # fill in the values
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec api node dist/db/createAdmin.js admin@example.com "Admin" 'a-strong-password'
#
# The API listens on 127.0.0.1:${API_PORT}; the public reverse proxy routes /api, /uploads and /media to it.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start; healthy once this node is PRIMARY.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }" | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    image: ghcr.io/binaryhubrw/tourista-be:${IMAGE_TAG:-production}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://mongo:27017/tourista?replicaSet=rs0
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    volumes:
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
